services:
  db:
    image: postgres:16-alpine
    container_name: service-control-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: henrique
      POSTGRES_PASSWORD: "12345"
      POSTGRES_DB: service-control
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U henrique -d service-control"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: service-control-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://henrique:12345@db:5432/service-control
      JWT_SECRET: supersecretkey
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: "*"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && node dist/index.js"

volumes:
  postgres_data:
