services:
  db:
    image: postgres:16-alpine
    container_name: service-control-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: henrique
      POSTGRES_PASSWORD: "12345"
      POSTGRES_DB: service-control
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
